[project]
name = "telegram-joplin"
version = "0.1.0"
description = "Telegram bot bridging Joplin notes and Google Tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.0",
    "openai>=1.0.0",
    "APScheduler>=3.10.0",
    "pytz>=2024.1",
    "structlog>=24.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-pytz>=2024.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false
